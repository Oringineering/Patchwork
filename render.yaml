services:
  - type: web
    name: patchwork-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PATCHWORK_DEMO_MODE
        value: "true"
      - key: PATCHWORK_REQUESTS_PER_HOUR
        value: "12"
      - key: NEBIUS_API_KEY
        sync: false

